<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>冻结反馈 · 表格复制</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#1d2939;font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1400px;margin:36px auto;padding:0 20px}h1{font-size:28px;margin:0}p{color:#526075}.card{background:white;border:1px solid #e0e6ee;border-radius:14px;padding:22px;margin-top:20px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}button{border:1px solid #cbd5e1;border-radius:8px;background:white;padding:11px 18px;font:inherit;cursor:pointer}button.primary{background:#245de5;color:white;border-color:#245de5}button:focus-visible,textarea:focus-visible{outline:3px solid #82b0ff}.notice{background:#fff8e8;border-radius:8px;padding:12px;color:#725715}#status{min-height:32px;color:#245de5}textarea{width:100%;height:220px;white-space:pre;overflow:auto;resize:vertical;border:1px solid #d5dde8;border-radius:8px;padding:12px;font:13px/1.8 monospace;background:#f9fbfd}.scroll{overflow:auto;max-height:520px}table{border-collapse:separate;border-spacing:0;font-size:13px;width:max-content}th,td{padding:10px 13px;border-right:1px solid #e6ebf1;border-bottom:1px solid #e6ebf1;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#edf2fa}tbody tr:nth-child(even){background:#f8fafd}h2{font-size:18px}.small{font-size:13px}.badge{color:#245de5;font-size:13px}@media(max-width:600px){main{padding:0 12px}.card{padding:14px}button{flex:1}}</style></head>
<body><main><span class="badge">空白生成器 · 28 列</span><h1>冻结反馈 · 表格复制</h1><p>复制后，在 Excel / WPS / 在线表格中选中起始单元格，再粘贴。制表符分列，换行分行。</p>
<section class="card"><h2>输入新记录</h2><p>把后台复制的编号记录粘贴到下面，格式与聊天中的记录一致；点击生成后会自动更新表格。</p><textarea id="raw-input" placeholder="例如：\n1\n会员账号\n用户姓名\n米兰\nVIP7\nWH3012\n2026-09-04 12:00:00\n..."></textarea><div class="toolbar"><button class="primary" id="generate">自动生成表格</button><button id="clear-input">清空输入</button></div><div id="parse-status" class="small" role="status" aria-live="polite"></div></section>
<section class="card"><div class="notice">粘贴前，将目标表格的 K、L 两列卡号设为“文本”，保留完整卡号。若从其他列开始粘贴，请设置对应的卡号列。</div>
<div class="toolbar"><button class="primary" id="copy-data">复制数据</button><button id="copy-all">复制表头及数据</button><button id="select-text">全选文本</button><button id="download">下载 TSV</button></div><div id="status" role="status" aria-live="polite">尚未生成数据。</div><textarea id="tsv" readonly spellcheck="false" aria-label="制表符表格数据"></textarea>
<p class="small">未提供的日期、状态、金额及派发信息会留空；重复值和登记情况暂按模板填入“-”。</p></section>
<section class="card"><h2>数据预览</h2><p class="small">横向滚动查看全部 28 列。本网页可离线使用。</p><div class="scroll"><table id="preview" aria-label="冻结反馈数据预览"></table></div></section></main>
<script>
'use strict';
const headers=['站点','反馈日期','反馈部门','冻结类型','使用类型','会员账号','用户姓名','VIP等级','后台订单号','订单金额','被冻结卡号（支付宝账号尾数4位）','清空格式卡号','重复值','银行卡是否登记申请过','被冻结日期','银行卡状态','活动一初审结果','提款10%安抚金6倍流水','存款冻结安抚金3倍流水','活动二审核结果','包赔金金额','运营审核备注','23号开始答谢红包运营填写金额','答谢红包红利填写派发状态','（安抚金+包赔金+答谢红包）','派发日期6倍（红利填写）','派发日期3倍存款冻结（红利填写）','派发日期1倍（红利填写）'];
const rows=[];
if(headers.length!==28||rows.some(row=>row.length!==28))throw new Error('表格列数校验失败');
const toTSV=withHeader=>(withHeader?[headers,...rows]:rows).map(row=>row.join('\t')).join('\r\n');
const field=document.getElementById('tsv'),status=document.getElementById('status');field.value=toTSV(false);
const rawInput=document.getElementById('raw-input'),parseStatus=document.getElementById('parse-status');
function parseRaw(text){
 const blocks=text.replace(/\r/g,'').split(/\n\s*(?=\d+\s*\n)/).map(b=>b.trim()).filter(Boolean), parsed=[];
 for(const block of blocks){
  let lines=block.replace(/\t/g,'\n').split('\n').map(s=>s.trim()).filter(Boolean); if(/^\d+$/.test(lines[0])) lines=lines.slice(1); if(lines.length<12) continue;
  const n=lines.findIndex(s=>/^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}$/.test(s)); if(n<4) continue;
  const account=lines[0]||''; const name=lines[1]||''; const site=lines[2]||'ML'; const vip=lines[3]||''; const dept=(lines[4]&&!/^\d{4}-/.test(lines[4]))?lines[4]:'';
  const t1=lines[n], t2=lines[n+1]||''; const order=lines[n+2]||''; const amount=lines[n+3]||''; const orderType=lines[n+4]||''; const freeze=lines[n+5]||''; const use=lines[n+6]||''; const card=lines[n+7]||''; const bank=lines[n+8]||'';
  const resultIndex=lines.findIndex((s,i)=>i>n+8&&(s==='拒绝'||s==='通过'||s==='不通过')); if(resultIndex<0) continue;
  const note=lines.slice(resultIndex+3).join(''); parsed.push([site,'2026-09-05',dept,freeze,use,account,name,vip,order,amount,/^https?:/.test(card)?'':card,/^https?:/.test(card)?'':card,'-','-',t2,bank,resultIndex>=0&&lines[resultIndex]==='通过'?'通过':'不通过','','','','',note,'','','','','','']);
 }
 return parsed;
}
function renderTable(){const table=document.getElementById('preview');table.innerHTML='';const thead=document.createElement('thead'),hr=document.createElement('tr');headers.forEach(v=>{const c=document.createElement('th');c.scope='col';c.textContent=v;hr.appendChild(c)});thead.appendChild(hr);table.appendChild(thead);const tb=document.createElement('tbody');rows.forEach(r=>{const tr=document.createElement('tr');r.forEach(v=>{const c=document.createElement('td');c.textContent=v;tr.appendChild(c)});tb.appendChild(tr)});table.appendChild(tb)}
document.getElementById('generate').addEventListener('click',()=>{const next=parseRaw(rawInput.value);if(!next.length){parseStatus.textContent='未识别到完整记录。请确认每条记录以编号开头，并包含“拒绝/通过”。';parseStatus.style.color='#b42318';return}rows.length=0;next.forEach(r=>rows.push(r));field.value=toTSV(false);renderTable();parseStatus.textContent=`已识别 ${next.length} 条记录，表格已更新。`;parseStatus.style.color='#18794e';status.textContent=`已生成 ${next.length} 条数据，可复制到表格。`});
document.getElementById('clear-input').addEventListener('click',()=>{rawInput.value='';parseStatus.textContent=''});
function selectText(){field.focus();field.select();field.setSelectionRange(0,field.value.length);}
async function copy(withHeader){field.value=toTSV(withHeader);let copied=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(field.value);copied=true;}}catch(error){}if(!copied){selectText();try{copied=document.execCommand('copy');}catch(error){}}status.textContent=copied?`已复制${withHeader?'表头及 ':''}${rows.length} 条数据（28 列），请到表格中粘贴。`:'自动复制未成功，已选中文本，请按 Ctrl+C（Mac：⌘C）复制。';}
document.getElementById('copy-data').addEventListener('click',()=>copy(false));
document.getElementById('copy-all').addEventListener('click',()=>copy(true));
document.getElementById('select-text').addEventListener('click',()=>{selectText();status.textContent='已全选，请按 Ctrl+C（Mac：⌘C）复制。';});
document.getElementById('download').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob(['\uFEFF'+toTSV(true)],{type:'text/tab-separated-values;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='冻结反馈-2026-09-05.tsv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent='已生成含表头的 TSV 文件。导入时请将卡号列设为文本。';});
renderTable();
</script></body></html>
